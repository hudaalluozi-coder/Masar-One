[platformio]
default_envs = head, chest, neck

[env]
platform = espressif32@6.9.0
board = esp32-c3-devkitm-1
framework = arduino
board_build.partitions = huge_app.csv
lib_deps = adafruit/Adafruit NeoPixel@1.12.3
monitor_speed = 115200
; Use the same unique 1–8 uppercase alphanumeric kit ID on all three boards.

[env:head]
build_flags = -D NODE_ROLE=1

[env:chest]
build_flags = -D NODE_ROLE=2

[env:neck]
build_flags = -D NODE_ROLE=3
